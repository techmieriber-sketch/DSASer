    <script>

      const questions = [

            { letter: "D", text: "Kun planlægning af opgaver", audio: "Kun planlaegning af opgaver.mp3" }

          options: [

            { letter: "B", text: "Hvordan du har det i arbejdet", audio: "Hvordan du har det i arbejdet.mp3" },
            { letter: "C", text: "Hvor mange rum du gør rent i", audio: "Hvor mange rum du gor rent i.mp3" },

        {

          questionAudio: "Hvad kan belaste arbejdsmiljoet.mp3",
          correct: "D",
          options: [
            { letter: "A", text: "God planlægning og tydelige beskeder", audio: "God planaegning og tydelige beskeder.mp3" },
            { letter: "B", text: "Respekt og godt samarbejde", audio: "Respekt og godt samarbejde.mp3" },
            { letter: "C", text: "Redskaber, der virker", audio: "Redskaber der virker.mp3" },
            { letter: "D", text: "Rod, støj, tidspres og uklare beskeder", audio: "Rod stoj tidspres og uklare beskeder.mp3" }
          ]
        },
        {
          question: "6. Hvorfor er et godt arbejdsmiljø vigtigt?",
          questionAudio: "Hvorfor er et godt arbejdsmiljo vigtigt.mp3",
          correct: "A",
          options: [
            { letter: "A", text: "Det mindsker risikoen for uheld og skader", audio: "Det mindsker risikoen for uheld og skader.mp3" },
            { letter: "B", text: "Det gør arbejdet mere uklart", audio: "Det gor arbejdet mere uklart.mp3" },
            { letter: "C", text: "Det giver flere konflikter", audio: "Det giver flere konflikter.mp3" },
            { letter: "D", text: "Det gør medarbejderne mere trætte", audio: "Det gor medarbejderne mere traette.mp3" }
          ]
        }
      ];

      const quizEl = document.getElementById("quiz");
      const resultEl = document.getElementById("quizResult");
      const showResultBtn = document.getElementById("showResultBtn");
      const resetBtn = document.getElementById("resetBtn");
      const quizArticle = document.getElementById("quizArticle");

      var currentQuizAudio = null;
      var currentQuizAudioBtn = null;

      function releasePriorQuizAudio() {
        if (currentQuizAudio) {
          try {
            currentQuizAudio.pause();
            currentQuizAudio.currentTime = 0;
          } catch (err) {}
          currentQuizAudio = null;
        }
        if (currentQuizAudioBtn) {
          currentQuizAudioBtn.classList.remove("is-audio-playing");
          currentQuizAudioBtn.classList.remove("is-audio-paused");
          var playL = currentQuizAudioBtn.getAttribute("data-aria-play");
          if (playL) currentQuizAudioBtn.setAttribute("aria-label", playL);
          currentQuizAudioBtn = null;
        }
      }

      function stashQuizBtnAria(btn) {
        if (!btn.getAttribute("data-aria-play")) {
          btn.setAttribute("data-aria-play", btn.getAttribute("aria-label") || "Afspil");
        }
      }

      function updateQuizAudioBtnAria(btn) {
        var idle = btn.getAttribute("data-aria-play");
        if (!btn.classList.contains("is-audio-playing") && !btn.classList.contains("is-audio-paused")) {
          if (idle) btn.setAttribute("aria-label", idle);
          return;
        }
        if (btn.classList.contains("is-audio-paused")) {
          btn.setAttribute("aria-label", "Fortsæt afspilning");
          return;
        }
        btn.setAttribute("aria-label", "Pause afspilning");
      }

      function resolveAudioUrl(filename) {
        if (!filename) return "";
        return new URL(encodeURIComponent(filename), window.location.href).href;
      }

      function playQuizAudioFile(filename, buttonEl) {
        if (!filename || !buttonEl) return;
        stashQuizBtnAria(buttonEl);
        if (currentQuizAudioBtn === buttonEl && currentQuizAudio) {
          if (!currentQuizAudio.paused) {
            currentQuizAudio.pause();
            buttonEl.classList.remove("is-audio-playing");
            buttonEl.classList.add("is-audio-paused");
            updateQuizAudioBtnAria(buttonEl);
            return;
          }
          buttonEl.classList.remove("is-audio-paused");
          buttonEl.classList.add("is-audio-playing");
          var pr = currentQuizAudio.play();
          if (pr !== undefined) {
            pr
              .then(function () {
                updateQuizAudioBtnAria(buttonEl);
              })
              .catch(function () {
                releasePriorQuizAudio();
              });
          } else {
            updateQuizAudioBtnAria(buttonEl);
          }
          return;
        }
        releasePriorQuizAudio();
        buttonEl.classList.remove("is-audio-paused");
        currentQuizAudioBtn = buttonEl;
        buttonEl.classList.add("is-audio-playing");
        var src = resolveAudioUrl(filename);
        currentQuizAudio = new Audio(src);
        currentQuizAudio.addEventListener("error", function onQuizAudioErr() {
          currentQuizAudio.removeEventListener("error", onQuizAudioErr);
          releasePriorQuizAudio();
        });
        currentQuizAudio.addEventListener("ended", function onQuizAudioEnd() {
          currentQuizAudio.removeEventListener("ended", onQuizAudioEnd);
          if (currentQuizAudioBtn === buttonEl) {
            buttonEl.classList.remove("is-audio-playing");
            buttonEl.classList.remove("is-audio-paused");
            var pl = buttonEl.getAttribute("data-aria-play");
            if (pl) buttonEl.setAttribute("aria-label", pl);
            currentQuizAudioBtn = null;
            try {
              currentQuizAudio.currentTime = 0;
            } catch (e2) {}
            currentQuizAudio = null;
          }
        });
        updateQuizAudioBtnAria(buttonEl);
        var p0 = currentQuizAudio.play();
        if (p0 !== undefined) {
          p0
            .then(function () {
              updateQuizAudioBtnAria(buttonEl);
            })
            .catch(function () {
              releasePriorQuizAudio();
            });
        } else {
          updateQuizAudioBtnAria(buttonEl);
        }
      }

      function ensureQuizAudioButtonIcons(btn) {
        var speaker = btn.querySelector(".quiz-audio-btn__svg--speaker");
        if (!speaker) {
          var raw = btn.querySelector(
            ".quiz-audio-btn__svg:not(.quiz-audio-btn__svg--pause):not(.quiz-audio-btn__svg--play)"
          );
          if (raw) {
            raw.classList.add("quiz-audio-btn__svg--speaker");
            speaker = raw;
          }
        }
        if (!speaker) return;
        var w = speaker.getAttribute("width") || "18";
        var h = speaker.getAttribute("height") || "18";
        if (!btn.querySelector(".quiz-audio-btn__svg--pause")) {
          var pauseSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          pauseSvg.setAttribute("class", "quiz-audio-btn__svg quiz-audio-btn__svg--pause");
          pauseSvg.setAttribute("width", w);
          pauseSvg.setAttribute("height", h);
          pauseSvg.setAttribute("viewBox", "0 0 24 24");
          pauseSvg.setAttribute("aria-hidden", "true");
          var u1 = document.createElementNS("http://www.w3.org/2000/svg", "use");
          u1.setAttribute("href", "#icon-pause");
          pauseSvg.appendChild(u1);
          btn.appendChild(pauseSvg);
        }
        if (!btn.querySelector(".quiz-audio-btn__svg--play")) {
          var playSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          playSvg.setAttribute("class", "quiz-audio-btn__svg quiz-audio-btn__svg--play");
          playSvg.setAttribute("width", w);
          playSvg.setAttribute("height", h);
          playSvg.setAttribute("viewBox", "0 0 24 24");
          playSvg.setAttribute("aria-hidden", "true");
          var u2 = document.createElementNS("http://www.w3.org/2000/svg", "use");
          u2.setAttribute("href", "#icon-play");
          playSvg.appendChild(u2);
          btn.appendChild(playSvg);
        }
      }

      function onQuizAudioClick(e) {
        var btn = e.target.closest(".quiz-audio-btn");
        if (!btn || !quizArticle.contains(btn)) return;
        var file = btn.getAttribute("data-audio");
        if (!file) return;
        e.preventDefault();
        e.stopPropagation();
        playQuizAudioFile(file, btn);
      }

      function renderQuiz() {
        quizEl.innerHTML = "";

        questions.forEach((q, index) => {
          const card = document.createElement("section");
          card.className = "question-card";
          card.dataset.correct = q.correct;

          const titleRow = document.createElement("div");
          titleRow.className = "question-title-row";

          const audioBtn = document.createElement("button");
          audioBtn.type = "button";
          audioBtn.className = "quiz-audio-btn quiz-audio-btn--compact";
          audioBtn.setAttribute("data-audio", q.questionAudio);
          audioBtn.setAttribute("aria-label", "Afspil spørgsmål " + String(index + 1) + " højt");
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "quiz-audio-btn__svg");
          svg.setAttribute("width", "20");
          svg.setAttribute("height", "20");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          var useEl = document.createElementNS("http://www.w3.org/2000/svg", "use");
          useEl.setAttribute("href", "#icon-speaker");
          svg.appendChild(useEl);
          audioBtn.appendChild(svg);

          const title = document.createElement("h2");
          title.className = "question-title";
          title.textContent = q.question;

          titleRow.appendChild(audioBtn);
          titleRow.appendChild(title);
          card.appendChild(titleRow);

          ensureQuizAudioButtonIcons(audioBtn);

          const optionsWrap = document.createElement("div");
          optionsWrap.className = "options";

          q.options.forEach((opt) => {
            const letter = opt.letter;
            const text = opt.text;
            const label = document.createElement("label");
            label.className = "option-label";
            label.dataset.letter = letter;

            const input = document.createElement("input");
            input.type = "radio";
            input.name = `question-${index}`;
            input.value = letter;

            const line = document.createElement("div");
            line.className = "option-line";

            const optAudioBtn = document.createElement("button");
            optAudioBtn.type = "button";
            optAudioBtn.className = "quiz-audio-btn quiz-audio-btn--option";
            optAudioBtn.setAttribute("data-audio", opt.audio);
            optAudioBtn.setAttribute("aria-label", "Afspil svar " + letter + " højt");
            var optSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            optSvg.setAttribute("class", "quiz-audio-btn__svg");
            optSvg.setAttribute("width", "18");
            optSvg.setAttribute("height", "18");
            optSvg.setAttribute("viewBox", "0 0 24 24");
            optSvg.setAttribute("aria-hidden", "true");
            var optUse = document.createElementNS("http://www.w3.org/2000/svg", "use");
            optUse.setAttribute("href", "#icon-speaker");
            optSvg.appendChild(optUse);
            optAudioBtn.appendChild(optSvg);
            ensureQuizAudioButtonIcons(optAudioBtn);

            const span = document.createElement("span");
            span.className = "option-text";
            span.innerHTML = `<span class="option-letter">${letter}.</span>${text}`;

            input.addEventListener("change", () => handleAnswer(card, letter));

            line.appendChild(optAudioBtn);
            line.appendChild(span);
            label.appendChild(input);
            label.appendChild(line);
            optionsWrap.appendChild(label);
          });

          const feedback = document.createElement("p");
          feedback.className = "question-feedback";
          feedback.setAttribute("aria-live", "polite");

          card.appendChild(optionsWrap);
          card.appendChild(feedback);
          quizEl.appendChild(card);
        });
      }

      function handleAnswer(card, chosenLetter) {
        const correctLetter = card.dataset.correct;
        const labels = card.querySelectorAll(".option-label");
        const feedback = card.querySelector(".question-feedback");
        const radios = card.querySelectorAll('input[type="radio"]');

        labels.forEach((label) => {
          const letter = label.dataset.letter;
          label.classList.remove("correct", "wrong");

          if (letter === correctLetter) {
            label.classList.add("correct");
          }

          if (letter === chosenLetter && chosenLetter !== correctLetter) {
            label.classList.add("wrong");
          }

          label.classList.add("disabled");
        });

        radios.forEach((radio) => {
          radio.disabled = true;
        });

        if (chosenLetter === correctLetter) {
          feedback.textContent = "Rigtigt";
          feedback.className = "question-feedback correct";
        } else {
          feedback.textContent = "Forkert";
          feedback.className = "question-feedback wrong";
        }
      }

      function showResult() {
        const cards = [...document.querySelectorAll(".question-card")];
        let correctCount = 0;
        let answeredCount = 0;

        cards.forEach((card) => {
          const correctLetter = card.dataset.correct;
          const chosen = card.querySelector('input[type="radio"]:checked');

          if (chosen) {
            answeredCount += 1;
            if (chosen.value === correctLetter) {
              correctCount += 1;
            }
          }
        });

        resultEl.textContent = `Du har ${correctCount} rigtige ud af ${questions.length}. Du har svaret på ${answeredCount} spørgsmål.`;
      }

      function resetQuiz() {
        releasePriorQuizAudio();
        renderQuiz();
        resultEl.textContent = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      showResultBtn.addEventListener("click", showResult);
      resetBtn.addEventListener("click", resetQuiz);
      quizArticle.addEventListener("click", onQuizAudioClick);

      var titleBtn = document.getElementById("quizTitleAudioBtn");
      if (titleBtn) {
        titleBtn.setAttribute("data-audio", QUIZ_AUDIO_PAGE_TITLE);
        ensureQuizAudioButtonIcons(titleBtn);
      }

      renderQuiz();
    </script>
  </body>
</html>
