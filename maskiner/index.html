<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maskiner – Dansk som andetsprog for serviceassistenter</title>
    <link rel="preload" id="page-bg-preload" href="" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="../arbejdsteknik/arbejdsteknik.css" />
    <style>
      .page-landing--maskiner .bg-image,
      .page-landing--maskiner .landing-photo {
        object-position: 50% 20%;
      }
    </style>
  </head>

  <body class="page-landing page-landing--maskiner">
    <div class="bg-media" aria-hidden="true">
      <img
        class="bg-image"
        src=""
        alt=""
        width="1920"
        height="1080"
        decoding="async"
        fetchpriority="high"
      />
    </div>
    <script>
      (function () {
        var F = "Baggrundsbillede.png";
        var u = new URL(F, location.href).href;
        var s = document.currentScript;
        var media = s && s.previousElementSibling;
        if (media && media.classList && media.classList.contains("bg-media")) {
          var im = media.querySelector("img.bg-image");
          if (im) im.src = u;
        }
        var p = document.getElementById("page-bg-preload");
        if (p) p.href = u;
      })();
    </script>

    <div class="bg-scrim" aria-hidden="true"></div>

    <div class="page-shell page-shell--landing">
      <main class="landing-card">
        <a class="back-link" href="../index.html">Tilbage til forsiden</a>

        <h1 class="page-title page-title--landing">Maskiner</h1>

        <figure class="landing-figure">
          <img
            class="landing-photo"
            src="Baggrundsbillede.png"
            alt=""
            width="1920"
            height="1080"
            decoding="async"
          />
        </figure>

        <h2 class="landing-section-title">Kategorier</h2>

        <ul class="landing-categories" role="list">
          <li>
            <a class="landing-category-link" href="tekst-om-maskiner/index.html">Tekst om maskiner</a>
          </li>
          <li>
            <a class="landing-category-link" href="rengoringsmaskiner/index.html">Rengøringsmaskiner</a>
          </li>
          <li>
            <a class="landing-category-link" href="brug-af-maskiner/index.html">Brug af maskiner</a>
          </li>
          <li>
            <a class="landing-category-link" href="sikker-brug/index.html">Sikker brug</a>
          </li>
          <li>
            <a class="landing-category-link" href="vedligeholdelse-af-maskiner/index.html"
              >Vedligeholdelse af maskiner</a
            >
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
